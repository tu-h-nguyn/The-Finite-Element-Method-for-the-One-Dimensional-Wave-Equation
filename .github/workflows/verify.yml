name: verify

# The report's tables are only worth what they can be regenerated from, so CI
# recomputes all four from source and fails if any entry drifts from the value
# printed in the PDF.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # This is the real check: every entry of Tables 1-4 is recomputed from
      # fem_wave.py and compared against the value printed in the PDF. The
      # script exits non-zero on a mismatch.
      - name: Recompute Tables 1-4 and check them against the report
        run: python3 reproduce_tables.py

      # The figures on the page are generated, but its tables are hand-written
      # HTML, so they are the one thing that can silently drift into a wrong
      # public claim. This re-derives every cell from the solver.
      - name: Check every number on the page against the solver
        run: python3 check_page_numbers.py

      # Figures are not byte-reproducible (matplotlib stamps a creation date),
      # so this is a smoke test that both figure sets still render, not a diff.
      - name: Regenerate both figure sets
        run: |
          python3 make_figs.py
          python3 make_figs.py --web
          test -f figures/fig_stability.pdf
          test -f docs/figures/fig_stability.svg

      # The canonical URL is read out of the page itself, so a repository
      # rename cannot leave this checking a stale address. A rename already
      # broke these links once; this is what would have caught it.
      - name: Confirm the published page is reachable at its own canonical URL
        run: |
          url=$(grep -oP '(?<=<link rel="canonical" href=")[^"]+' docs/index.html)
          echo "canonical: $url"
          code=$(curl -s -o /tmp/live.html -w '%{http_code}' -L --retry 4 --retry-delay 15 "$url" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::warning::$url returned HTTP $code - if Pages is mid-deploy, re-run in a few minutes."
          elif ! grep -q "is not enough" /tmp/live.html; then
            echo "::error::$url serves a page that is not this one - the canonical URL is pointing somewhere else."
            exit 1
          else
            echo "Published page is live at its canonical URL."
          fi

      - name: Confirm the served page still references every figure it ships
        run: |
          for f in convergence stability energy; do
            grep -q "figures/fig_${f}.svg" docs/index.html \
              || { echo "::error::docs/index.html does not reference fig_${f}.svg"; exit 1; }
          done
          # the solution figure is the animation, not an SVG
          grep -q "figures/fig_solution.gif" docs/index.html \
            || { echo "::error::docs/index.html does not reference fig_solution.gif"; exit 1; }
          test -s docs/figures/fig_solution.gif \
            || { echo "::error::fig_solution.gif was not generated"; exit 1; }
          echo "All four figures are referenced by the page."
